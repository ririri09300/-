<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLOCK BREAKER</title><style>body{background:#10141e;color:white;font:16px system-ui;text-align:center;margin:12px}main{max-width:480px;margin:auto}canvas{width:100%;background:#080c14;border:1px solid #344052;border-radius:10px;touch-action:none}button{background:#80e5ce;border:0;border-radius:8px;padding:12px 25px;font-weight:bold;margin:8px}h2{letter-spacing:3px}#hud{display:flex;justify-content:space-between;margin:10px}</style><main><h2>BLOCK BREAKER</h2><div id="hud"><span id="score"></span><span id="life"></span></div><canvas id="c" width="480" height="520"></canvas><div id="msg">すべてのブロックを破壊しよう</div><button id="start">START GAME</button><button id="reset">リセット</button><p>← → / マウス / スワイプで操作</p></main><script>
const c=document.getElementById('c'),g=c.getContext('2d'),W=480,H=520,pw=96,py=486,r=7;let blocks,px,x,y,vx,vy,score,life,running=false,keys={},last=0;const colors=['#fa7590','#f5a66d','#f5d77b','#80dfb0','#78bdf3','#b49af5'];const $=id=>document.getElementById(id);function ball(){px=192;x=240;y=475;vx=(Math.random()<.5?-1:1)*3;vy=-4.2}function hud(){$('score').textContent='SCORE '+score;$('life').textContent='LIFE '+'♥ '.repeat(life)+'♡ '.repeat(3-life)}function stop(msg,label){running=false;$('msg').textContent=msg;$('start').textContent=label;$('start').hidden=false}function init(){blocks=[];for(let j=0;j<6;j++)for(let i=0;i<8;i++)blocks.push({x:18+i*56,y:30+j*27,w:50,h:20,color:colors[j],alive:true});score=0;life=3;ball();hud();stop('すべてのブロックを破壊しよう','START GAME')}function rect(x,y,w,h,color){g.fillStyle=color;g.beginPath();g.roundRect(x,y,w,h,4);g.fill()}function draw(){g.clearRect(0,0,W,H);for(const b of blocks)if(b.alive)rect(b.x,b.y,b.w,b.h,b.color);rect(px,py,pw,12,'#80e5ce');g.fillStyle='white';g.font='bold 16px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('和',x,y)}function update(dt){px=Math.max(0,Math.min(W-pw,px+((keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0))*8*dt));let ox=x,oy=y;x+=vx*dt;y+=vy*dt;if(x<r){x=r;vx=Math.abs(vx)}if(x>W-r){x=W-r;vx=-Math.abs(vx)}if(y<r){y=r;vy=Math.abs(vy)}if(vy>0&&oy+r<=py&&y+r>=py&&x+r>=px&&x-r<=px+pw){let a=Math.max(-1,Math.min(1,(x-px-pw/2)/(pw/2)))*1.05,s=Math.min(9,Math.hypot(vx,vy)*1.025);vx=s*Math.sin(a);vy=-s*Math.cos(a);y=py-r}for(const b of blocks)if(b.alive&&x+r>b.x&&x-r<b.x+b.w&&y+r>b.y&&y-r<b.y+b.h){b.alive=false;score+=100;if(oy+r<=b.y||oy-r>=b.y+b.h)vy=-vy;else if(ox+r<=b.x||ox-r>=b.x+b.w)vx=-vx;else vy=-vy;hud();break}if(blocks.every(b=>!b.alive)){stop('GAME CLEAR!','PLAY AGAIN');return}if(y-r>H){life--;hud();if(!life)stop('GAME OVER','RETRY');else{ball();stop('残りライフ：'+life,'CONTINUE')}}}function loop(t){let dt=Math.min(2,(t-last)/16.667||1);last=t;if(running){let n=Math.max(1,Math.ceil(dt*2));for(let i=0;i<n&&running;i++)update(dt/n)}draw();requestAnimationFrame(loop)}function move(e){if(!running)return;let b=c.getBoundingClientRect();px=Math.max(0,Math.min(W-pw,(e.clientX-b.left)*W/b.width-pw/2))}c.onpointermove=move;c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);move(e)};onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){keys[e.key]=true;e.preventDefault()}};onkeyup=e=>keys[e.key]=false;onblur=()=>keys={};$('start').onclick=()=>{if(!life||blocks.every(b=>!b.alive))init();running=true;$('start').hidden=true;$('msg').textContent='PLAYING'};$('reset').onclick=init;init();requestAnimationFrame(loop);
</script></html>
