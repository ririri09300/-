function hud(){$('score').textContent='SCORE '+score;$('life').textContent='BALL × '+balls.length;}
function stop(msg,label){running=false;ended=true;$('msg').textContent=msg;$('start').textContent=label;$('start').hidden=false;}
function init(){blocks=[];for(let j=0;j<15;j++)for(let i=0;i<8;i++)blocks.push({x:48+i*48,y:65+j*27,w:44,h:23,color:colors[j%6],alive:true});px=192;balls=[{x:240,y:py-r-3,vx:3,vy:-4.2}];drops=[];score=0;stop('「和」を拾ってラーメン弾を増やそう','START GAME');ended=false;hud();}
function rect(x,y,w,h,color){g.fillStyle=color;g.beginPath();g.roundRect(x,y,w,h,4);g.fill();}
function draw(){g.clearRect(0,0,W,H);for(const b of blocks)if(b.alive){if(blockImg.complete&&blockImg.naturalWidth)g.drawImage(blockImg,b.x,b.y,b.w,b.h);else rect(b.x,b.y,b.w,b.h,b.color);}rect(px,py,pw,12,'#80e5ce');for(const b of balls){if(ramen.complete&&ramen.naturalWidth)g.drawImage(ramen,b.x-r,b.y-r,2*r,2*r);else{g.fillStyle='white';g.beginPath();g.arc(b.x,b.y,r,0,Math.PI*2);g.fill();}}g.font='bold 25px sans-serif';g.textAlign='center';g.textBaseline='middle';for(const d of drops){g.shadowColor='#ffd76a';g.shadowBlur=12;g.fillStyle='#ffe08a';g.fillText('和',d.x,d.y);g.shadowBlur=0;}}
function doubleBalls(){const copies=balls.map(b=>{let a=Math.atan2(b.vx,-b.vy)+(Math.random()<.5?-.35:.35),s=Math.hypot(b.vx,b.vy);return {x:b.x,y:b.y,vx:s*Math.sin(a),vy:-s*Math.cos(a)};});balls=balls.concat(copies);hud();}
function update(dt){px=Math.max(0,Math.min(W-pw,px+((keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0))*8*dt));for(const b of balls){let ox=b.x,oy=b.y;b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x<r){b.x=r;b.vx=Math.abs(b.vx)}if(b.x>W-r){b.x=W-r;b.vx=-Math.abs(b.vx)}if(b.y<r){b.y=r;b.vy=Math.abs(b.vy)}if(b.vy>0&&oy+r<=py&&b.y+r>=py&&b.x+r>=px&&b.x-r<=px+pw){let a=Math.max(-1,Math.min(1,(b.x-px-pw/2)/(pw/2)))*1.05,s=Math.min(9,Math.hypot(b.vx,b.vy)*1.025);b.vx=s*Math.sin(a);b.vy=-s*Math.cos(a);b.y=py-r;}for(const k of blocks){if(k.alive&&b.x+r>k.x&&b.x-r<k.x+k.w&&b.y+r>k.y&&b.y-r<k.y+k.h){k.alive=false;score+=100;if(oy+r<=k.y||oy-r>=k.y+k.h)b.vy=-b.vy;else if(ox+r<=k.x||ox-r>=k.x+k.w)b.vx=-b.vx;else b.vy=-b.vy;if(Math.random()<.05)drops.push({x:k.x+k.w/2,y:k.y+k.h/2});break;}}}balls=balls.filter(b=>b.y-r<=H);if(blocks.every(b=>!b.alive)){hud();stop('GAME CLEAR!','PLAY AGAIN');return;}if(!balls.length){hud();stop('GAME OVER','RETRY');return;}drops=drops.filter(d=>{let oy=d.y;d.y+=2.5*dt;if(oy+12<=py&&d.y+12>=py&&d.x+12>=px&&d.x-12<=px+pw){doubleBalls();return false;}return d.y-12<H;});hud();}
function loop(t){let dt=Math.min(2,(t-last)/16.667||1);last=t;if(running){let n=Math.max(1,Math.ceil(dt*3));for(let i=0;i<n&&running;i++)update(dt/n)}draw();requestAnimationFrame(loop)}function move(e){if(!running)return;let b=c.getBoundingClientRect();px=Math.max(0,Math.min(W-pw,(e.clientX-b.left)*W/b.width-pw/2))}c.onpointermove=move;c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);move(e)};onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){keys[e.key]=true;e.preventDefault()}};onkeyup=e=>keys[e.key]=false;onblur=()=>keys={};$('start').onclick=()=>{if(ended)init();running=true;$('start').hidden=true;$('msg').textContent='「和」を拾うとラーメン弾が2倍！'};$('reset').onclick=init;init();requestAnimationFrame(loop);
